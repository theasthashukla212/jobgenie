# Production defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobgenie}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:jobgenie}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.jobgenie=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:2592000000}
app.resume.storage-dir=${RESUME_STORAGE_DIR:/var/lib/jobgenie/uploads/resumes}
app.cors.origins=${FRONTEND_ORIGINS:https://app.example.com}
app.jobs.external-url=${EXTERNAL_JOBS_URL:https://www.arbeitnow.com/api/job-board-api}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
app.ai.api-url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}

spring.servlet.multipart.max-file-size=${MAX_RESUME_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_RESUME_REQUEST_SIZE:6MB}

server.port=${SERVER_PORT:8080}
