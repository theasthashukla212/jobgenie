# Development defaults
spring.datasource.url=${DB_URL:jdbc:h2:mem:jobgenie-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
