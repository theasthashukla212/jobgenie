spring.config.import=optional:file:./.env[.properties]
spring.application.name=jobgenie-backend
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:2592000000}
app.resume.storage-dir=${RESUME_STORAGE_DIR:./uploads/resumes}
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}
app.jobs.external-url=${EXTERNAL_JOBS_URL:https://www.arbeitnow.com/api/job-board-api}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
app.ai.api-url=${AI_API_URL:https://api.groq.com/openai/v1/chat/completions}
spring.servlet.multipart.max-file-size=${MAX_RESUME_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_RESUME_REQUEST_SIZE:6MB}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=${SERVER_PORT:8080}
